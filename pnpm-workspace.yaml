# Dependencies may run install scripts only when reviewed and listed here (pnpm 12 fails the install otherwise).
# pnpm's default minimum release age also applies: versions published in the last day are refused.
# Pin an older version rather than adding an exclusion.
allowBuilds:
  # postinstall only re-checks the native binding, which pnpm already installs as an optional dependency
  '@swc/core': false
  # Testcontainers (dev only) pulls in ssh2; its optional native speed-ups are not needed
  cpu-features: false
  ssh2: false
  # OpenTelemetry's protobufjs postinstall only prints a version notice
  protobufjs: false
  # BullMQ's msgpackr has a pure-JS fallback; the optional native extractor is not needed
  msgpackr-extract: false

linkWorkspacePackages: true
saveWorkspaceProtocol: rolling
