# Desktop bundles (architecture §13 and §18, criterion 1.8): Windows x64 and macOS universal.
# The bundles are unsigned until Phase 13, which adds code signing, notarisation and the updater.
name: Desktop

on:
  pull_request:
    paths:
      - apps/desktop/**
      - packages/app/**
      - packages/ui/**
      - packages/contracts/**
      - .github/workflows/desktop.yml
  push:
    tags:
      - desktop-v*
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  bundle:
    name: Bundle (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
          - os: macos-latest
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin x86_64-apple-darwin
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No version input: the action reads it from packageManager in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # rustup is preinstalled on GitHub's Windows and macOS images, so no third-party action is needed.
      - name: Set up Rust
        env:
          RUST_TARGETS: ${{ matrix.rust-targets }}
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          read -r -a targets <<< "$RUST_TARGETS"
          rustup target add "${targets[@]}"
          rustc --version

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the frontend
        run: pnpm --filter @cip/desktop build

      - name: Scan the frontend for server settings and secrets
        run: pnpm run scan:artifacts -- apps/desktop/dist

      # tauri.ci.conf.json drops beforeBuildCommand, so the bundle embeds exactly the dist/ scanned above.
      - name: Build the bundles (unsigned)
        env:
          TARGET: ${{ matrix.target }}
        run: pnpm --filter @cip/desktop tauri build --target "$TARGET" --config src-tauri/tauri.ci.conf.json

      - name: Upload the bundles
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cip-desktop-${{ matrix.target }}
          path: apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/
          if-no-files-found: error
          retention-days: 14
