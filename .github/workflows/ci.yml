# Pull-request pipeline (architecture §18, criterion 1.2): every check below must pass to merge.
# Third-party actions are pinned to full commit SHAs; the version is in the trailing comment.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f

jobs:
  checks:
    name: Format, lint, types, dependency rules, unit tests, build, artefact scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Formatting
        run: pnpm format:check
      - name: Lint (ESLint, type-aware)
        run: pnpm lint
      - name: Typecheck (TypeScript 7)
        run: pnpm typecheck
      - name: Dependency rules (architecture §4)
        run: pnpm depcruise
      - name: No exchange private endpoints (architecture §14)
        run: pnpm check:no-trading
      - name: Unit tests with coverage gates (NFR-15)
        run: pnpm test:coverage
      - name: Build
        run: pnpm build
      - name: Scan the web build for secrets and server settings (criterion 1.6)
        run: pnpm scan:artifacts apps/web/dist
      - name: Second opinion on the web build (gitleaks)
        run: docker run --rm -v "$PWD/apps/web/dist:/scan:ro" "$GITLEAKS_IMAGE" dir /scan --no-banner --redact

  integration:
    name: Integration tests (TimescaleDB and Valkey via Testcontainers)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Integration tests with coverage gates (auth, RBAC matrix, audit chain, BullMQ on Valkey)
        run: pnpm test:integration:coverage

  e2e:
    name: Stack start-up and Playwright smoke tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start the stack with the documented command (criterion 1.1)
        run: |
          start=$(date +%s)
          docker compose up --build --wait --wait-timeout 300
          echo "Stack built and healthy after $(( $(date +%s) - start )) s" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Playwright smoke tests
        run: pnpm e2e
      - name: Image scan, critical vulnerabilities with a fix available (server)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cip-server:dev
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Image scan, critical vulnerabilities with a fix available (web)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cip-web:dev
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Collect service logs
        if: failure()
        run: docker compose logs --no-color --timestamps > compose-logs.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-diagnostics
          path: |
            e2e/playwright-report
            e2e/test-results
            compose-logs.txt
          retention-days: 7
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
