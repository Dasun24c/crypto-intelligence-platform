# Nightly live smoke test (criterion 2.11): the stack against the real venues' public market data.
# Pull requests and e2e use only the replay venue; this is the one run that depends on Binance and
# Coinbase being reachable from the runner (see the Phase 2 acceptance report on regional access).
name: Nightly live smoke test

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke:
    name: Stack streams live market data
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Start the stack (live venues)
        run: docker compose up --build --wait --wait-timeout 300
      - name: Every instrument streams, serves a ticker and writes candles
        run: node scripts/live-smoke.mjs http://localhost:3000
      - name: Collect service logs
        if: failure()
        run: docker compose logs --no-color --timestamps > compose-logs.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: live-smoke-diagnostics
          path: compose-logs.txt
          retention-days: 7
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
